function textPanel(){let body='';if(state.ocrState==='error')body=`<div class="notice" role="alert"><p>Text could not be recognized. Try again, or choose a language.</p>${btn('Retry','retry','primary')}<details><summary>Details</summary>Sample error: the recognition engine could not read its temporary files.</details></div>`;else if(state.ocrState==='empty')body=`<div class="notice"><p>No text found. Try a closer capture or choose the text's language.</p>${btn('Try again','retry','primary')}</div>`;else if(state.ocrState==='loading')body=`<div role="status" aria-live="polite">Recognizing text…</div>${btn('Cancel recognition','ocr-close')}`;else body=`<textarea aria-label="Extracted text" spellcheck="false">Launch review\nA clear plan. A confident team.\n\n01 Design\n02 Build\n03 Ship\n\nReady for the next step</textarea><div class="text-actions">${btn('Copy all text','copy-text','primary','copy')}<button type="button" data-action="copy-selection" ${state.selection?'':'disabled'}>Copy selection</button></div>`;return `<aside class="text-panel" aria-label="Extracted text"><div class="panel-title">Extracted text ${iconBtn('Close text panel','ocr-close','x')}</div><div class="back-to-image">${btn('Back to image','ocr-close','quiet','arrow-left')}</div><label class="muted">Language <select aria-label="Recognition language"><option>Auto detect</option><option>English</option><option>Latvian</option></select></label>${body}</aside>`}
function propertiesPanel(){
 if(state.ocr||['Select','Pan'].includes(state.tool))return '';
 const colors=[['Black','#34343f'],['Red','#c53549'],['Green','#287749'],['Blue','#286db5'],['Purple','#625fc6']];
 return `<aside class="floating-properties options" aria-label="${state.tool} properties"><div class="property-heading"><span>${state.tool}</span>${iconBtn('Hide properties','properties-close','x')}</div><fieldset><legend>Stroke</legend><div class="swatches">${colors.map(([name,color])=>`<button type="button" class="swatch" style="--swatch:${color}" data-color="${name}" aria-label="${name} stroke" aria-pressed="${state.color===name}" data-tooltip="${name}">${state.color===name?icon('check'):''}</button>`).join('')}</div></fieldset>${state.tool==='Text'?`<fieldset><legend>Text size</legend><div class="segments">${['16','28','40'].map(size=>`<button type="button" data-text-size="${size}" aria-pressed="${state.textSize===size}">${size}</button>`).join('')}</div></fieldset>`:`<fieldset><legend>Stroke width</legend><div class="segments">${[['Thin',1],['Medium',2],['Thick',4]].map(([name,width])=>`<button type="button" data-stroke="${name}" aria-label="${name} stroke" aria-pressed="${state.stroke===name}" data-tooltip="${name}"><span class="weight-line" style="--weight:${width}px"></span></button>`).join('')}</div></fieldset>`}${!['Text','Highlight','Pen'].includes(state.tool)?`<fieldset><legend>Line finish</legend><div class="segments"><button type="button" data-sketch="false" aria-pressed="${!state.sketch}">Precise</button><button type="button" data-sketch="true" aria-pressed="${state.sketch}">Sketch</button></div></fieldset>`:''}<div class="property-delete">${btn('Delete selection','delete-annotation','quiet','trash-2')}</div></aside>`;
}
function editor(){return `${title('Screenshot editor · Unsaved changes')}<div class="editor-stage"><div class="editor-top"><div class="editor-menu">${iconBtn('Settings','settings','menu')}${iconBtn('Tool properties','properties','sliders-horizontal',`aria-expanded="${state.properties==='open'}"`)}</div><div class="tools" aria-label="Annotation tools">${toolList.map(([name,i,key],n)=>`${n===2||n===9?'<span class="tool-divider"></span>':''}<button type="button" class="icon-button" data-tool="${name}" aria-label="${name}" aria-pressed="${state.tool===name}" data-tooltip="${name} · ${key}">${icon(i)}</button>`).join('')}</div><div class="exports">${btn('Extract text','ocr',state.ocr?'active':'','scan-text')}${btn('Copy','copy','','copy')}${btn('Save copy…','save','primary','save')}</div></div>${propertiesPanel()}<div class="workspace ${state.ocr?'has-text':''}"><div class="canvas">${sample()}</div>${state.ocr?textPanel():''}</div><div class="canvas-footer"><div class="canvas-navigation"><div class="navigation-group">${iconBtn('Zoom out','zoom-out','minus')}${btn(state.zoom+'%','fit','quiet')}${iconBtn('Zoom in','zoom-in','plus')}</div><div class="navigation-group">${iconBtn('Undo · Ctrl+Z','undo','undo-2')}${iconBtn('Redo · Ctrl+Shift+Z','redo','redo-2')}</div></div><span class="canvas-feedback" role="status" aria-live="polite" id="bss-status">${state.status}</span></div></div>`}
function launcher(){return `${title('BetterScreenShot','launcher-close')}<div class="launcher-list">${[['Capture full screen','Choose a monitor','monitor','preview'],['Capture area','Drag to select an area','scan','preview'],['Scrolling capture','Select an area, then scroll','gallery-vertical-end','scroll'],['Record area','Select an area, then choose a format','video','record'],['Open image…','Edit an existing image','image-plus','editor']].map(([a,b,c,d])=>`<button type="button" class="capture-row" data-screen="${d}">${icon(c)}<span>${a}<small>${b}</small></span></button>`).join('')}</div><div class="launcher-footer"><span>Ready</span>${btn('Settings','settings','quiet','settings-2')}</div>`}
function preview(){return `<div class="preview-content"><div class="pending-nav">${btn('Previous','previous-capture','quiet','chevron-left')}<span>Capture ${state.pendingIndex||1} of 2</span>${btn('Next','next-capture','quiet','chevron-right')}</div>${sample()}<div class="preview-actions">${btn('Copy','copy','','copy')}${btn('Save copy…','save','primary','save')}</div><div class="preview-secondary">${btn('Edit','edit','quiet','pencil')}${btn('Discard…','discard','quiet danger','trash-2')}</div><div class="muted" role="status" aria-live="polite">${state.status==='Unsaved changes'?'':state.status}</div></div>`}
function capture(kind){const rec=kind==='record',running=rec?state.recording:state.scrolling;return `${title(rec?'Record area':'Scrolling capture','cancel-capture')}<div class="capture-toolbar"><div class="capture-heading"><strong>${rec?(running?'<span class="record-dot"></span>Recording · <span class="time">0:07</span>':'Ready to record'):(running?'Capturing':'Ready to capture')}</strong>${!running?`<label>${rec?'Quality':'Direction'}<select aria-label="${rec?'Video quality':'Scroll direction'}">${rec?'<option>High</option><option>Standard</option>':'<option>Down</option><option>Right</option>'}</select></label>`:''}</div><div class="capture-actions">${running?btn('Stop and keep',rec?'stop-record':'stop-scroll','primary','square'):rec?btn('Record video','start-record','primary','video')+btn('Record GIF','start-record','','film'):btn('Start capture','start-scroll','primary','scan')}${btn(running?'Discard…':'Cancel','cancel-capture','quiet '+(running?'danger':''))}</div><p class="capture-status" role="status">${rec?(running?'The selected area is being recorded.':'Choose a format to start recording.'):(running?'2,460 pixels captured. Keep scrolling slowly.':'Press Start capture, then scroll downward.')}</p></div>`}
function viewer(){return `${title('Recording preview','discard')}<div class="commands"><span>Video recording</span><div class="exports">${btn('Copy file','copy-file','','copy')}${btn('Save copy…','save','primary','save')}</div></div><div class="workspace"><div class="canvas">${sample()}</div></div><div class="playback">${btn(state.playing?'Pause':'Play','play','','play')}<input type="range" min="0" max="12" value="7" aria-label="Playback position"><span class="time">0:07 / 0:12</span></div><div class="statusbar" role="status">${state.status==='Unsaved changes'?'Ready to preview':state.status}</div>`}
function settings(){let content='';if(state.tab==='Capture')content=`<h3>Capture shortcuts</h3><div class="muted">Select a shortcut field, then press your preferred keys.</div><div class="setting-row"><label for="full-shortcut">Full screen</label><div class="field"><input id="full-shortcut" type="text" placeholder="Set shortcut" aria-label="Full screen shortcut"></div></div><div class="setting-row"><label for="area-shortcut">Capture area</label><div class="field"><input id="area-shortcut" type="text" value="Ctrl + Shift + A" aria-label="Capture area shortcut"></div></div><label style="margin-top:20px"><input type="checkbox">Use Shift+Win+S for capture area</label><p class="muted">Replaces Windows Snipping Tool while BetterScreenShot is running.</p>`;else if(state.tab==='Editor')content=`<h3>Editor defaults</h3>${[['Starting tool','Select'],['Annotation color','Purple'],['Stroke width','Medium'],['Text size','28 px']].map(([a,b])=>`<div class="setting-row"><label for="setting-${a.replaceAll(' ','-')}">${a}</label><select id="setting-${a.replaceAll(' ','-')}"><option>${b}</option></select></div>`).join('')}<label style="margin-top:16px"><input type="checkbox" checked>Remember the last used tool</label>`;else if(state.tab==='Export')content=`<h3>Image quality</h3><div class="setting-row"><label for="jpeg-quality">JPEG quality</label><select id="jpeg-quality"><option>High · 95</option><option>Standard · 85</option><option>Maximum · 100</option></select></div><p class="muted">PNG and clipboard images preserve full resolution. JPEG trades file size for image detail.</p>`;else content=`<h3>BetterScreenShot</h3><p>Version 1.1.6</p><p class="muted">Automatically checks for updates every 24 hours.</p>${btn('Check for updates','updates')}`;return `${title('Settings','settings-cancel')}<nav class="settings-nav" aria-label="Settings categories">${['Capture','Editor','Export','About'].map(t=>`<button type="button" data-tab="${t}" aria-pressed="${state.tab===t}">${t}</button>`).join('')}</nav><div class="settings-content">${content}</div><div class="settings-footer">${btn('Cancel','settings-cancel')}${btn('Save settings','settings-save','primary')}</div>`}
let restoreControl=null;
function focusKey(el){return el?.id?{id:el.id}:el?.dataset?.action?{action:el.dataset.action}:el?.dataset?.tool?{tool:el.dataset.tool}:el?.dataset?.tab?{tab:el.dataset.tab}:null;}
function restoreFocus(key){if(!key)return;const el=[...app.querySelectorAll('button,input,select,textarea')].find(el=>key.id?el.id===key.id:key.action?el.dataset.action===key.action:key.tool?el.dataset.tool===key.tool:el.dataset.tab===key.tab);el?.focus();}
function modalMarkup(){if(!state.modal)return '';const discard=state.modal==='discard';return `<dialog class="dialog" aria-labelledby="bss-dialog-title"><h3 id="bss-dialog-title">${discard?'Discard this capture?':'Save your changes before closing?'}</h3><p>${discard?'This removes the temporary capture. Saved copies stay on disk.':'Your annotations have not been saved to a file. The original image will stay unchanged.'}</p><div class="dialog-actions">${discard?'':btn('Save copy…','dialog-save','primary','save')}${btn(discard?'Discard':'Discard changes','dialog-discard','danger')}${btn(discard?'Keep capture':'Keep editing','dialog-cancel')}</div></dialog>`;}
function render(){const key=focusKey(document.activeElement);app.dataset.theme=state.theme;app.dataset.editor=String(state.screen==='editor');app.dataset.properties=state.properties;app.dataset.hasProperties=String(!state.ocr&&!['Select','Pan'].includes(state.tool));app.dataset.ocr=String(state.ocr&&state.screen==='editor');app.style.maxWidth=state.compact?'620px':({launcher:'520px',preview:'360px',scroll:'460px',record:'460px',settings:'620px'}[state.screen]||'100%');app.innerHTML=({editor,launcher,preview,scroll:()=>capture('scroll'),record:()=>capture('record'),viewer,settings}[state.screen]||editor)()+modalMarkup();if(state.screen==='editor'){app.querySelector('.titlebar>span').textContent='Screenshot editor'+(state.dirty?' · Unsaved changes':'');app.querySelector('[data-action=ocr]').setAttribute('aria-pressed',String(state.ocr));if(state.ocr)app.querySelector('.panel-title').insertAdjacentHTML('beforeend',`<span class="compact-back">${btn('Back to image','ocr-close','quiet','arrow-left')}</span>`);}
if(state.screen==='launcher')app.querySelector('.launcher-footer').insertAdjacentHTML('afterbegin',iconBtn('Change theme','theme','sun-moon'));
if(state.screen==='record'&&state.recording){const actions=app.querySelector('.capture-actions');const keep=btn('Stop and keep','stop-record','primary','square');const inactive=`<button type="button" disabled>${state.format==='gif'?'Record video':'Record GIF'}</button>`;actions.innerHTML=(state.format==='gif'?inactive+keep:keep+inactive)+btn('Discard…','cancel-capture','quiet danger');}
if(state.screen==='settings'){const f=app.querySelector('#full-shortcut'),a=app.querySelector('#area-shortcut');if(f)f.value=state.fullShortcut;if(a)a.value=state.areaShortcut;if(state.conflict&&a){a.setAttribute('aria-invalid','true');a.setAttribute('aria-describedby','shortcut-error');a.parentElement.insertAdjacentHTML('beforeend','<p id="shortcut-error" class="field-error" role="alert">This shortcut is already in use. Choose another combination.</p>');}if(state.tab==='Editor')app.querySelector('.settings-content').insertAdjacentHTML('beforeend',`<h3 style="margin-top:22px">Tool shortcuts</h3><div class="settings-keys">${toolList.map(([name,,key])=>`<label>${name}<select aria-label="${name} shortcut"><option>${key}</option></select></label>`).join('')}</div><p class="muted">E is reserved for Extract text.</p>`);}
if(state.screen==='scroll'&&state.gap){const el=app.querySelector('.capture-status');el.classList.add('notice');el.innerHTML='No overlap found. Scroll back until the previous content reappears, then continue more slowly.';el.setAttribute('role','alert');}
syncPropertiesButton();root.querySelector('#review-screen').value=state.screen;root.querySelector('#review-theme').value=state.theme;if(globalThis.lucide)lucide.createIcons();const dialog=app.querySelector('dialog');if(dialog){dialog.showModal();dialog.querySelector('[data-action=dialog-cancel]').focus();dialog.addEventListener('cancel',e=>{e.preventDefault();state.modal=null;render();restoreFocus(restoreControl)});}else restoreFocus(key);}
function announce(text){root.querySelector('#review-announcement').textContent=text;}
function syncPropertiesButton(){const b=app.querySelector('[data-action=properties]');if(!b)return;const panel=app.querySelector('.floating-properties');b.disabled=!panel;b.setAttribute('aria-expanded',String(!!panel&&getComputedStyle(panel).display!=='none'));}
new ResizeObserver(syncPropertiesButton).observe(app);
function status(text){state.status=text;render();announce(text);}
function navigate(screen){state.screen=screen;state.status='Unsaved changes';state.modal=null;announce('');render();}
root.querySelector('#review-screen').addEventListener('change',e=>navigate(e.target.value));root.querySelector('#review-theme').addEventListener('change',e=>{state.theme=e.target.value;render()});
root.querySelector('#review-state').addEventListener('change',e=>{const v=e.target.value;state.conflict=false;state.gap=false;state.ocr=false;state.ocrState='normal';if(['text','error','empty','loading'].includes(v)){state.screen='editor';state.ocr=true;state.ocrState=v==='text'?'normal':v;}if(v==='conflict'){state.screen='settings';state.tab='Capture';state.conflict=true;}if(v==='gap'){state.screen='scroll';state.scrolling=true;state.gap=true;}render();});
app.addEventListener('input',e=>{if(e.target.id==='full-shortcut')state.fullShortcut=e.target.value;if(e.target.id==='area-shortcut'){state.areaShortcut=e.target.value;state.conflict=false;}});
app.addEventListener('select',e=>{if(e.target.matches('textarea')){state.selection=e.target.selectionEnd>e.target.selectionStart;const b=app.querySelector('[data-action=copy-selection]');if(b)b.disabled=!state.selection;}},true);
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 const field=b.dataset.color?'color':b.dataset.stroke?'stroke':b.dataset.textSize?'textSize':b.dataset.sketch!==undefined?'sketch':null;
 if(field){e.stopImmediatePropagation();state[field]=field==='sketch'?b.dataset.sketch==='true':b.dataset[field];const descriptor=field==='color'?'color':field==='stroke'?'stroke':field==='textSize'?'textSize':'sketch';const selected=b.dataset[descriptor];render();[...app.querySelectorAll('button')].find(el=>el.dataset[descriptor]===selected)?.focus();announce(field+' updated');return;}
 if(b.dataset.action==='properties'||b.dataset.action==='properties-close'){e.stopImmediatePropagation();if(b.dataset.action==='properties-close')state.properties='closed';else {const panel=app.querySelector('.floating-properties');state.properties=panel&&getComputedStyle(panel).display!=='none'?'closed':'open';}render();app.querySelector('[data-action=properties]')?.focus();return;}
 if(b.dataset.tool){state.properties='auto';state.ocr=false;}
},true);
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.modal&&state.properties==='open'){e.preventDefault();state.properties='closed';render();app.querySelector('[data-action=properties]')?.focus();}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(['close','discard','cancel-capture'].includes(a)){e.stopImmediatePropagation();restoreControl=focusKey(b);if(a==='close'&&!state.dirty){navigate('launcher');return;}if(a==='cancel-capture'&&!state.recording&&!state.scrolling){navigate('launcher');return;}state.modal=a==='close'?'close':'discard';render();return;}
if(a==='dialog-cancel'){e.stopImmediatePropagation();state.modal=null;render();restoreFocus(restoreControl);return;}
if(['dialog-save','dialog-discard'].includes(a)){e.stopImmediatePropagation();state.dirty=false;state.recording=false;state.scrolling=false;navigate('launcher');announce(a==='dialog-save'?'Simulated: a copy was saved before closing.':'Simulated: the temporary capture was discarded.');return;}
if(a==='retry'){e.stopImmediatePropagation();state.ocrState='normal';render();app.querySelector('textarea')?.focus();return;}
if(a==='copy-selection'){e.stopImmediatePropagation();status('Copied selected text');return;}
if(a==='settings-save'&&((state.fullShortcut&&state.fullShortcut.trim().toLowerCase()===state.areaShortcut.trim().toLowerCase())||state.conflict)){e.stopImmediatePropagation();state.conflict=true;state.tab='Capture';render();app.querySelector('#area-shortcut')?.focus();return;}
if(a==='start-record')state.format=b.textContent.includes('GIF')?'gif':'video';
if(a==='theme'){e.stopImmediatePropagation();state.theme=state.theme==='dark'?'light':'dark';render();return;}
if(a==='previous-capture'||a==='next-capture'){e.stopImmediatePropagation();state.pendingIndex=state.pendingIndex===2?1:2;state.status='Viewing pending capture '+state.pendingIndex;render();announce(state.status);return;}
if(a==='save')state.dirty=false;
if(a==='ocr-close'){e.stopImmediatePropagation();state.ocr=false;render();app.querySelector('[data-action=ocr]')?.focus();return;}
},true);
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){navigate(b.dataset.screen);return;}if(b.dataset.tool){state.tool=b.dataset.tool;status(state.tool+' selected');return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}const a=b.dataset.action;switch(a){case 'ocr':state.ocr=!state.ocr;render();break;case 'ocr-close':state.ocr=false;render();break;case 'copy':status('Copied image');break;case 'copy-text':status('Copied all text');break;case 'copy-file':status('Copied video file');break;case 'save':status('Saved copy · launch-review.png');break;case 'settings':navigate('settings');break;case 'edit':navigate('editor');break;case 'undo':status('Undid last annotation');break;case 'redo':status('Restored annotation');break;case 'delete-annotation':status('Annotation deleted · Ctrl+Z to undo');break;case 'zoom-in':state.zoom=Math.min(200,state.zoom+10);render();break;case 'zoom-out':state.zoom=Math.max(20,state.zoom-10);render();break;case 'fit':state.zoom=100;render();break;case 'start-record':state.recording=true;render();break;case 'start-scroll':state.scrolling=true;render();break;case 'stop-record':state.recording=false;navigate('viewer');break;case 'stop-scroll':state.scrolling=false;navigate('preview');break;case 'play':state.playing=!state.playing;render();break;case 'settings-save':announce('Settings saved in this preview.');navigate('launcher');break;case 'settings-cancel':navigate('launcher');break;case 'updates':announce('Update check simulated. No network request was made.');break;default:announce('This action is a design preview.');}});
app.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||state.modal||e.ctrlKey||e.metaKey||e.altKey)return;const found=toolList.find(t=>t[2].toLowerCase()===e.key.toLowerCase());if(state.screen==='editor'&&found){e.preventDefault();state.tool=found[0];state.ocr=false;render();restoreFocus({tool:state.tool});announce(state.tool+' selected');}});
function restorePreferences(saved){if(!saved)return;if(['editor','launcher','preview','scroll','record','viewer','settings'].includes(saved.screen))state.screen=saved.screen;if(['system','light','dark'].includes(saved.theme))state.theme=saved.theme;}
let preferenceStamp=window.openai?.widgetState?.modelContent?.stamp||0;
restorePreferences(window.openai?.widgetState?.modelContent);
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.modelContent;if(saved&&saved.stamp>preferenceStamp){preferenceStamp=saved.stamp;restorePreferences(saved);render();}});
root.addEventListener('change',e=>{if(!['review-screen','review-theme'].includes(e.target.id))return;preferenceStamp=Date.now();if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.screen,theme:state.theme,stamp:preferenceStamp},privateContent:null}).catch(()=>{});});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addToggle(state,'compact',{label:'Compact editor · 620 px'});}
})();
</script>
